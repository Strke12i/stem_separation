[package]
name = "analyzer-native"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Fase 13 lab: Rust/PyO3 extension for the analysis worker (not part of the product build)"

[lib]
name = "analyzer_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }

# Standalone on purpose: the lab must not join the product workspace, so
# `cargo test --workspace` never needs a Python toolchain.
[workspace]
