[project]
name = "music-analyzer-analysis-worker"
version = "0.1.0"
description = "Phase 0 NDJSON sidecar for Local Music Analyzer"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
music-analyzer-analysis-worker = "music_analyzer_worker.__main__:main"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "music_analyzer_worker"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
